{{ define "content" }}
<section class="relative min-h-screen flex items-center justify-center overflow-hidden px-6 -mt-36">

  <div class="absolute inset-0 -z-10">
    <img src="/static/images/photos/new-hero-bg.jpg" alt="Mariage" class="w-full h-full object-cover opacity-50" blur-none/>
    <div class="absolute inset-0 bg-gradient-to-t from-white/80 via-white/50 to-white/20"></div>
  </div>

  <div class="relative max-w-2xl text-center">
    <h1 class="font-title text-5xl md:text-6xl text-deep-green mb-6 opacity-0 translate-y-6 animate-fade-slide-in">
      Merci d'avoir été là

      Le <strong>25 avril 2026</strong>, vous avez rendu ce jour inoubliable.
    </p>
    <p class="text-md mb-12 opacity-0 translate-y-6 animate-fade-slide-in delay-200">
      Merci pour vos rires, votre amour, vos danses douteuses et votre présence.<br>
      On garde tout ça précieusement.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center opacity-0 translate-y-6 animate-fade-slide-in delay-300">
      <a href="/photos" class="inline-flex items-center justify-center focus:ring-4 text-base font-semibold py-3 px-6 rounded-lg shadow-lg transition-transform transform hover:scale-105 hover:shadow-xl">
