{{ define "content" }}
<div class="container mx-auto px-4 py-8 max-w-4xl">

  <div class="flex flex-col items-center pb-8">
    <h1 class="font-title text-4xl text-center mb-2">Nos prestataires</h1>
    <div class="flex justify-center w-6 border border-bloomrose mb-6"></div>
    <p class="text-md text-center max-w-lg">Nous avons eu la chance de travailler avec des personnes formidables. N'hésitez pas à faire appel à elles !</p>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">

    <div class="flex flex-col rounded-2xl overflow-hidden shadow-md border border-(--color-bloomrose)">
      <img src="/static/images/photos/photographe.jpg" alt="Chloé Artières" class="w-full h-72 object-cover" draggable="false" />
      <div class="p-5 flex flex-col gap-2">
        <p class="text-xs uppercase tracking-widest opacity-50 font-mono">Photographie</p>
        <p class="font-title text-xl">Chloé Artières</p>
        <a href="https://chloeartieresphotographe.com/" class="text-sm underline hover:text-(--color-secondary)" target="_blank">Site web</a>
      </div>
    </div>

    <div class="flex flex-col rounded-2xl overflow-hidden shadow-md border border-(--color-bloomrose)">
      <img src="/static/images/photos/traiteur.jpg" alt="BIG." class="w-full h-72 object-cover" draggable="false" />
      <div class="p-5 flex flex-col gap-2">
        <p class="text-xs uppercase tracking-widest opacity-50 font-mono">Traiteur</p>
        <p class="font-title text-xl">BIG.</p>
        <a href="https://www.big-events.fr/" class="text-sm underline hover:text-(--color-secondary)" target="_blank">Site web</a>
      </div>
    </div>

    <div class="flex flex-col rounded-2xl overflow-hidden shadow-md border border-(--color-bloomrose)">
      <img src="/static/images/photos/fleurs.jpg" alt="Ancolie Vagabonde" class="w-full h-72 object-cover" draggable="false" />
      <div class="p-5 flex flex-col gap-2">
        <p class="text-xs uppercase tracking-widest opacity-50 font-mono">Fleurs</p>
        <p class="font-title text-xl">Ancolie Vagabonde</p>
        <a href="https://ancolie-vagabonde.com/" class="text-sm underline hover:text-(--color-secondary)" target="_blank">Site web</a>
      </div>
    </div>

  </div>
</div>
{{ end }}
